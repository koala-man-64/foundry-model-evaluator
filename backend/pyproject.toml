[project]
name = "foundry-model-evaluator"
version = "0.1.0"
description = "Local web app comparing Microsoft Foundry models on quality, token usage, latency, and estimated token cost."

requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=1.14,<2",
    "fastapi>=0.143,<1",
    "httpx2>=2.13,<3",
    "keyring>=25.7,<26",
    "pydantic>=2.14,<3",
    "regex>=2025.9,<2028",
    "truststore>=0.10",
    "uvicorn>=0.54,<1",
]

[project.scripts]
foundry-eval = "foundry_eval.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=6",
    "ruff>=0.17",
    "types-regex>=2025.9",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "windows_only: test exercises Windows-specific behaviour",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["foundry_eval"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ASYNC"]
ignore = [
    "S101",   # asserts are fine in tests and for internal invariants
    "S608",   # SQL is built only from fixed fragments with bound parameters
    "RUF012", # mutable class attributes in pydantic models are fine
]

[tool.ruff.lint.per-file-ignores]
"src/foundry_eval/devtools/**" = ["E501"]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "B017", "PT018", "E501", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["foundry_eval"]

[[tool.mypy.overrides]]
module = ["keyring.*", "truststore.*"]
ignore_missing_imports = true
