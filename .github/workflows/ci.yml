name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q --cov
      - name: Accounting code is fully covered
        run: >
          uv run coverage report --fail-under=100
          --include="src/foundry_eval/usage/*,src/foundry_eval/pricing/calculator.py,src/foundry_eval/pricing/units.py"
      - name: OpenAPI document is up to date
        run: |
          uv run foundry-eval export-openapi --output "$RUNNER_TEMP/openapi.json"
          diff -u openapi.json "$RUNNER_TEMP/openapi.json"

  frontend:
    name: Frontend and browser tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: |
          npm ci
          uv sync --locked --project ../backend
      - name: API types match the OpenAPI document
        run: |
          npx openapi-typescript ../backend/openapi.json -o "$RUNNER_TEMP/schema.d.ts"
          diff -u src/api/schema.d.ts "$RUNNER_TEMP/schema.d.ts"
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (mock Foundry, no paid calls)
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.platform }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  windows:
    name: Windows setup, backend tests and start-up
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings scripts/PSScriptAnalyzerSettings.psd1
          if ($results) { $results | Format-Table -AutoSize | Out-String -Width 200; exit 1 }
      - name: Run scripts\setup.cmd (Windows PowerShell 5.1)
        shell: cmd
        run: scripts\setup.cmd -Dev
      - name: Backend tests
        working-directory: backend
        shell: pwsh
        run: |
          $python = Join-Path $env:LOCALAPPDATA 'FoundryModelEvaluator\runtime\venv\Scripts\python.exe'
          & $python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start the app with scripts\start.cmd and load the UI
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'scripts\start.cmd', '-NoBrowser' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
              try {
                $ready = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health).StatusCode -eq 200
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw 'The app did not start.' }
            $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
            if ($page.Content -notmatch '<title>Foundry Model Evaluator</title>') { throw 'The web interface was not served.' }
            $settings = Invoke-RestMethod http://127.0.0.1:8765/api/settings
            Write-Output "Credential store: $($settings.keyring_backend)"
            if ($settings.keyring_backend -notmatch 'WinVault') { throw 'Windows Credential Manager is not the key store.' }
            if ($settings.data_dir -notlike "$env:LOCALAPPDATA*") { throw "Unexpected data folder $($settings.data_dir)" }
          } finally {
            taskkill /PID $proc.Id /T /F | Out-Null
          }
